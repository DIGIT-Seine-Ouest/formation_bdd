<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Exploiter le plein potentiel des données — DIGIT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/reset.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/reveal.min.css">
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="reveal">
    <div class="slides" id="slides-container"></div>
</div>
<script src="slides/intro.js"></script>
<script src="slides/donnees.js"></script>
<script src="slides/regles.js"></script>
<script src="slides/avance.js"></script>
<script src="slides/digit.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/reveal.js"></script>
<script>
    document.getElementById('slides-container').innerHTML =
        (window.SLIDES.intro   || '') +
        (window.SLIDES.donnees || '') +
        (window.SLIDES.regles  || '') +
        (window.SLIDES.avance  || '') +
        (window.SLIDES.digit   || '');
    Reveal.initialize({ hash: true, slideNumber: 'c/t', transition: 'slide', center: true, width: 1100, height: 700 });
</script>
</body>
</html>
